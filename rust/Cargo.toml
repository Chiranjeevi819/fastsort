[package]
name = "mazesort"
version = "0.1.0"
edition = "2021"
authors = ["Chiranjeevi D"]
description = "MazeSort — Zero-dependency, zero-allocation In-Place Maze256 MSD radix sort for integers and floats (single-threaded and multi-core parallel)."
license = "MIT"
repository = "https://github.com/Chiranjeevi819/mazesort"
readme = "README.md"
keywords = ["mazesort", "sort", "radix-sort", "in-place", "parallel"]
categories = ["algorithms", "no-std"]

[features]
default = ["std"]
std = []

[dependencies]

[[bench]]
name = "bench"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
